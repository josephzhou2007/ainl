[project]
name = "ainl"
version = "0.1.0"
description = "AI-native learning agent: a chat-first inbox for Canvas and the tools it hands off to"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "apscheduler>=3.10,<4",
    "latex2mathml>=3.77",
    "anthropic>=0.40",
    "pillow>=10",
    "psutil>=5.9",
    "websockets>=14",          # scale-up/viewer.py: Canvas login page + CDP
    "cryptography>=46,<51",    # Cookie Management: encrypted Canvas sessions
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
